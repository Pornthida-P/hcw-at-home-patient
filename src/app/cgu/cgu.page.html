<ion-content>
    <div class='center'>
        <div class="custom-card">
            <div class="container">
                <div class="title">
                    {{ 'cgu.selectCountry' | translate }}
                    <div id="hhpCountrySelect">
                        <div class="sl-container" *ngIf="!countryError">
                            <ion-icon name="globe"></ion-icon>
                            <select class="lang" #langSelect (change)="changeCountry(langSelect.value)">
                                <option *ngFor="let country of countries"
                                        [value]="country"
                                >{{ country }}
                                </option>
                            </select>
                        </div>
                        <app-select-language [hideIcon]="true"
                                             (selectedLanguageChange)="onLanguageChange($event)"></app-select-language>

                    </div>
                </div>
                <div class="back">
                    <button class="btn big"
                            type="button"
                            (click)="goBack()"
                    >
                        {{ 'cgu.backToHome' | translate }}
                    </button>
                </div>

                <h2>{{ 'cgu.termsAndConditions' | translate }}</h2>

                <!-- Content is loaded and validated in CguPage (never the index.html fallback) -->
                <markdown *ngIf="termsContent" [data]="termsContent"></markdown>
                <p class="terms-not-available" *ngIf="!termsLoading && !termsContent">
                    {{ 'cgu.notAvailable' | translate }}
                </p>

                <div class="back">
                    <button class="btn big"
                            type="button"
                            (click)="goBack()">
                        {{ 'cgu.backToHome' | translate }}
                    </button>
                </div>
            </div>
        </div>
    </div>
</ion-content>
