<div id="hhpMultiLang">
  <div class="sl-container">
    <ion-icon name="globe" *ngIf="!hideIcon"></ion-icon>
    <select class="lang" #langSelect [value]="selectedLanguage" (change)="changeLang(langSelect.value)">
      <option
        *ngFor="let lang of supportedLanguages"
        [value]="lang"
        [attr.selected]="lang === selectedLanguage ? '' : null"
      >{{languageLabels[lang] || lang}}</option>
    </select>
  </div>
</div>
